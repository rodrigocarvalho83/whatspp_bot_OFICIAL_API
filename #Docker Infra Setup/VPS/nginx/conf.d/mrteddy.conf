server {
    listen 80;
    server_name teddybot.mrteddypizza.com.br grafana.mrteddypizza.com.br pgadmin.mrteddypizza.com.br;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name teddybot.mrteddypizza.com.br;

    ssl_certificate /etc/letsencrypt/live/teddybot.mrteddypizza.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/teddybot.mrteddypizza.com.br/privkey.pem;

    location / {
        proxy_pass http://n8n:5678;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

server {
    listen 443 ssl;
    server_name grafana.mrteddypizza.com.br;

    ssl_certificate /etc/letsencrypt/live/grafana.mrteddypizza.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/grafana.mrteddypizza.com.br/privkey.pem;

    location / {
        proxy_pass http://grafana:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

server {
    listen 443 ssl;
    server_name pgadmin.mrteddypizza.com.br;

    ssl_certificate /etc/letsencrypt/live/pgadmin.mrteddypizza.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pgadmin.mrteddypizza.com.br/privkey.pem;

    location / {
        proxy_pass http://pgadmin:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
