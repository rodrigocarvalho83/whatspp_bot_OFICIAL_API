version: "3.8"

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: always
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=chatwoot
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=COLOQUE_SENHA_FORTE_AQUI

  n8n:
    image: n8nio/n8n
    restart: always
    depends_on:
      - postgres
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=admin
      - N8N_BASIC_AUTH_PASSWORD=COLOQUE_SENHA_FORTE_AQUI
      - N8N_HOST=bot.mrteddypizza.com.br
      - N8N_PORT=5678
      - N8N_PROTOCOL=https
      - WEBHOOK_URL=https://bot.mrteddypizza.com.br
      - N8N_ENCRYPTION_KEY=GERAR_CHAVE_FORTE_32_CHARS
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=chatwoot
      - DB_POSTGRESDB_USER=postgres
      - DB_POSTGRESDB_PASSWORD=COLOQUE_SENHA_FORTE_AQUI
    volumes:
      - n8n_data:/home/node/.n8n

  firebird_api:
    build: ./firebird_api
    restart: unless-stopped
    ports:
      - "127.0.0.1:8088:8088"
    environment:
      FIREBIRD_DSN: "host.docker.internal/3050:C:\\Users\\rodri\\AppData\\Local\\RAL Tecnologia\\CreateInstall\\CONSUMER.FDB"
      FIREBIRD_USER: "SYSDBA"
      FIREBIRD_PASSWORD: "masterkey"

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: always
    command: tunnel --config /etc/cloudflared/config.yml run
    volumes:
      - ./cloudflared:/etc/cloudflared:ro
    depends_on:
      - n8n

volumes:
  postgres_data:
  n8n_data:
