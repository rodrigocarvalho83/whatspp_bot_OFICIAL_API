version: "3.8"

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: mrteddy-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - internal

  n8n:
    image: n8nio/n8n:latest
    container_name: mrteddy-n8n
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      N8N_BASIC_AUTH_ACTIVE: "true"
      N8N_BASIC_AUTH_USER: ${N8N_BASIC_AUTH_USER}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_BASIC_AUTH_PASSWORD}

      N8N_HOST: teddybot.mrteddypizza.com.br
      N8N_PORT: 5678
      N8N_PROTOCOL: https
      WEBHOOK_URL: https://teddybot.mrteddypizza.com.br
      N8N_EDITOR_BASE_URL: https://teddybot.mrteddypizza.com.br
      N8N_PROXY_HOPS: 1
      N8N_SECURE_COOKIE: "true"

      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}

      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB}
      DB_POSTGRESDB_USER: ${POSTGRES_USER}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}

      TZ: America/Sao_Paulo
      GENERIC_TIMEZONE: America/Sao_Paulo
    volumes:
      - n8n_data:/home/node/.n8n
    expose:
      - "5678"
    networks:
      - internal

  grafana:
    image: grafana/grafana:latest
    container_name: mrteddy-grafana
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD}
      GF_SERVER_ROOT_URL: https://grafana.mrteddypizza.com.br
      GF_SERVER_DOMAIN: grafana.mrteddypizza.com.br
    volumes:
      - grafana_data:/var/lib/grafana
    expose:
      - "3000"
    networks:
      - internal

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: mrteddy-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    expose:
      - "80"
    networks:
      - internal

  nginx:
    image: nginx:stable-alpine
    container_name: mrteddy-nginx
    restart: unless-stopped
    depends_on:
      - n8n
      - grafana
      - pgadmin
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    networks:
      - internal

networks:
  internal:
    driver: bridge

volumes:
  postgres_data:
  n8n_data:
  grafana_data:
  pgadmin_data:
